# Global Settings
# ------------------------------------------------------------------------------
# protocol: selects the proxy protocol. Supported values: "http" or "milter".
protocol: http

# listen_addr: the address the HTTP proxy listens on (e.g., ":8080").
# Applies to: HTTP protocol.
listen_addr: ":8080"

# tls_cert_file: path to the TLS certificate file for the proxy server.
# Applies to: All protocols (if applicable).
tls_cert_file: ""

# tls_key_file: path to the TLS key file for the proxy server.
# Applies to: All protocols (if applicable).
tls_key_file: ""

# Milter Adapter Settings
# ------------------------------------------------------------------------------
# milter_listen_addr: the TCP address for the Milter proxy listener.
# Applies to: Milter protocol.
milter_listen_addr: ":9999"

# primary_milter_addr: the address of the primary Milter backend.
# Applies to: Milter protocol.
primary_milter_addr: "127.0.0.1:9997"

# shadow_milter_addr: the address of the shadow Milter backend.
# Applies to: Milter protocol.
shadow_milter_addr: "127.0.0.1:9998"

# milter_timeout: the timeout for Milter upstream operations.
# Applies to: Milter protocol.
milter_timeout: "2s"

# HTTP Adapter Settings
# ------------------------------------------------------------------------------
# primary_base_urls: list of primary HTTP backends for load distribution.
# Applies to: HTTP protocol.
primary_base_urls:
  - "https://127.0.0.1:9001"

# primary_selection_mode: strategy for selecting one primary backend per request.
# Supported values: "round_robin", "source_ip_hash".
# Applies to: HTTP protocol.
primary_selection_mode: "round_robin"

# shadow_base_urls: list of shadow HTTP backends for load distribution.
# Applies to: HTTP protocol.
shadow_base_urls:
  - "https://127.0.0.1:9002"

# shadow_selection_mode: strategy for selecting one shadow backend per request.
# Supported values: "round_robin", "source_ip_hash".
# Applies to: HTTP protocol.
shadow_selection_mode: "round_robin"

# root_ca: path to a common CA certificate for all upstream backends.
# Applies to: All protocols (HTTP upstreams or Milter if TLS is used).
root_ca: ""

# primary_root_ca: path to the CA certificate specifically for the primary backend.
# Applies to: All protocols.
primary_root_ca: ""

# shadow_root_ca: path to the CA certificate specifically for the shadow backend.
# Applies to: All protocols.
shadow_root_ca: ""

# insecure_upstream: allows insecure TLS connections (no verification) to backends.
# Applies to: All protocols.
insecure_upstream: false

# Shadow & Rate Limiting Settings
# ------------------------------------------------------------------------------
# shadow_sample_percent: percentage of traffic mirrored to shadow (0-100).
# Applies to: All protocols.
shadow_sample_percent: 5

# shadow_force_header: header name that (if present) forces shadowing.
# Applies to: HTTP protocol.
shadow_force_header: "X-Shadow"

# primary_request_headers: optional static headers added to requests sent to primary.
# path_rules[].primary_request_headers can override these values per matched path.
# Applies to: HTTP protocol.
primary_request_headers: {}

# shadow_request_headers: optional static headers added to requests sent to shadow.
# path_rules[].shadow_request_headers can override these values per matched path.
# Applies to: HTTP protocol.
shadow_request_headers: {}

# shadow_rps: maximum requests per second for the shadow backend (0 disables).
# Applies to: All protocols.
shadow_rps: 200

# shadow_burst: maximum number of tokens in the token bucket (burst capacity).
# Applies to: All protocols.
shadow_burst: 400

# shadow_timeout: time limit for requests to the shadow backend.
# Applies to: HTTP protocol (for Milter, milter_timeout is used).
shadow_timeout: "150ms"

# max_backend_body_bytes: limits the size of the request body sent to backends.
# Applies to: HTTP protocol.
max_backend_body_bytes: 32768

# upstream_http_dial_timeout: timeout for establishing upstream TCP connections.
# Applies to: HTTP protocol.
upstream_http_dial_timeout: "2s"

# upstream_http_tls_handshake_timeout: timeout for upstream TLS handshakes.
# Applies to: HTTP protocol.
upstream_http_tls_handshake_timeout: "5s"

# upstream_http_response_header_timeout: timeout to receive upstream response headers.
# Applies to: HTTP protocol.
upstream_http_response_header_timeout: "5s"

# upstream_http_max_idle_conns: max idle keep-alive connections across all hosts.
# Applies to: HTTP protocol.
upstream_http_max_idle_conns: 1024

# upstream_http_max_idle_conns_per_host: max idle keep-alive connections per host.
# Applies to: HTTP protocol.
upstream_http_max_idle_conns_per_host: 256

# upstream_http_max_conns_per_host: max total connections per host (0 = unlimited).
# Applies to: HTTP protocol.
upstream_http_max_conns_per_host: 0

# upstream_http_protocol: upstream protocol mode (auto, http1, or http2).
# auto negotiates HTTP/2 when available, http1 disables it, and http2 rejects HTTP/1.1 fallback.
# Applies to: HTTP protocol.
upstream_http_protocol: auto

# Header & Comparison Settings
# ------------------------------------------------------------------------------
# forward_response_headers: headers passed from the primary backend to the client.
# Applies to: HTTP protocol.
forward_response_headers:
  - "Auth-Status"
  - "Auth-Server"
  - "Auth-Port"
  - "Auth-User"
  - "Auth-Pass"
  - "Auth-Error"
  - "Auth-Wait"
  - "Auth-Protocol"
  - "X-Nauthilus-Session"
  - "Location"
  - "Set-Cookie"
  - "Content-Type"
  - "Cache-Control"
  - "Pragma"
  - "Expires"
  - "WWW-Authenticate"
  - "Content-Encoding"
  - "Vary"

# compare_headers: list of headers compared between primary and shadow.
# Applies to: All protocols (if applicable).
compare_headers:
  - "Auth-Status"
  - "Auth-Server"
  - "Auth-Port"
  - "Auth-User"
  - "Auth-Error"
  - "X-Nauthilus-Session"

# compare_mode: selects the comparison mode (nginx, header, json, html).
# Applies to: HTTP protocol.
compare_mode: "nginx"

# compare_json_strict: controls strict JSON comparison behavior.
# Applies to: HTTP protocol.
compare_json_strict: false

# compare_html_threshold: required similarity for HTML comparison (0.0-1.0).
# Applies to: HTTP protocol.
compare_html_threshold: 0.99

# Path Rule Settings
# ------------------------------------------------------------------------------
# path_rules: optional ordered HTTP path policy. Empty preserves global behavior.
# Rules match the inbound path before path_mapping rewrites it. If this list is
# non-empty and no rule matches, the request is primary-only.
# Applies to: HTTP protocol.
path_rules: []

# Example: JSON API comparison, metrics/health deny, and catch-all primary-only.
# path_rules:
#   - name: json-api
#     methods: ["POST"]
#     match: "^/api/v1/json$"
#     shadow: auto
#     compare: on
#     compare_mode: json
#     compare_headers:
#       - "Content-Type"
#       - "X-Api-Status"
#     primary_request_headers:
#       X-Route-Backend: json-primary
#     shadow_request_headers:
#       X-Route-Backend: json-shadow
#
#   - name: metrics-health
#     match: "^/(metrics|healthz)$"
#     shadow: never
#     compare: off
#
#   - name: default-primary-only
#     match: "^/.*$"
#     shadow: never
#     compare: off

# Logging Settings
# ------------------------------------------------------------------------------
# log_session_only_on_diff: log session headers only when differences exist.
# Applies to: All protocols.
log_session_only_on_diff: true

# log_json: whether the logger should output JSON.
# Applies to: All protocols.
log_json: true

# Observability Settings
# ------------------------------------------------------------------------------
# observability: optional OpenMetrics and OpenTelemetry exporters.
# All observability features are opt-in. W3C trace context is propagated when
# a trace is active; trace_id_header adds the bare trace ID for downstream logs.
observability:
  prometheus_enabled: false
  prometheus_address: "127.0.0.1"
  prometheus_port: 9464
  prometheus_path: "/metrics"
  prometheus_runtime_metrics: false
  # prometheus_http_auth_basic: "metrics:change-me"
  prometheus_tls:
    enabled: false
    # cert: "/etc/doppelgaenger/metrics.crt"
    # key: "/etc/doppelgaenger/metrics.key"
    min_tls_version: "1.2"
  otel_enabled: false
  otel_traces_enabled: false
  otel_metrics_enabled: false
  otel_service_name: "doppelgaenger"
  # otel_service_version defaults to the binary version.
  # otel_exporter_otlp_endpoint: "http://127.0.0.1:4318"
  # otel_exporter_otlp_headers:
  #   authorization: "Bearer token"
  otel_exporter_otlp_insecure: false
  otel_sample_ratio: 1.0
  trace_id_header: "X-Trace-ID"

# Path Mapping Settings
# ------------------------------------------------------------------------------
# path_mapping: controls how incoming request paths are mapped to backends.
# Applies to: HTTP protocol.
path_mapping:
  # mode: "direct" (1:1 mapping) or "rewrite" (regex-based).
  mode: direct
  # rules: list of rewrite rules (only used if mode is "rewrite").
  rules: []
