services:
  doppelgaenger:
    build: .
    user: "1000:1000"
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - apparmor:docker-default
    ports:
      - "8443:8443"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - ./certs:/certs:ro
    restart: unless-stopped

  fakehttpserver-primary:
    build:
      context: .
      dockerfile: Dockerfile.faker
    user: "1000:1000"
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - apparmor:docker-default
    ports:
      - "9001:9001"
    volumes:
      - ./fakehttpserver-primary.yaml:/app/fakehttpserver.yaml:ro
    restart: unless-stopped

  fakehttpserver-shadow:
    build:
      context: .
      dockerfile: Dockerfile.faker
    user: "1000:1000"
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - apparmor:docker-default
    ports:
      - "9002:9002"
    volumes:
      - ./fakehttpserver-shadow.yaml:/app/fakehttpserver.yaml:ro
    restart: unless-stopped
