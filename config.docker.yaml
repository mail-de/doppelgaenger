# Global Settings
# ------------------------------------------------------------------------------
# protocol: selects the proxy protocol. Supported values: "http", "grpc", or "milter".
protocol: http

# listen_addr: the address the HTTP proxy listens on.
listen_addr: ":8443"

# tls_cert_file: path to the TLS certificate file for the HTTP proxy listener.
tls_cert_file: "/certs/cert.pem"

# tls_key_file: path to the TLS key file for the HTTP proxy listener.
tls_key_file: "/certs/key.pem"

# gRPC Adapter Settings
# ------------------------------------------------------------------------------
# These settings are inactive while protocol is http, but document the Docker
# shape for switching this file to protocol: grpc.
grpc_listen_addr: ":9444"
grpc_tls:
  enabled: false
  # cert: "/certs/grpc.crt"
  # key: "/certs/grpc.key"
  # client_ca: "/certs/clients-ca.pem"
  require_client_cert: false
  min_tls_version: "1.2"
primary_grpc_targets: []
# Example:
# primary_grpc_targets:
#   - name: primary
#     address: "fakegrpcserver-primary:9445"
#     tls:
#       enabled: false
#       # client_cert: "/certs/grpc-client.crt"
#       # client_key: "/certs/grpc-client.key"
primary_grpc_selection_mode: "round_robin"

# Caller authentication is mandatory when backend OIDC is enabled.
# Choose introspection (below) or mtls with grpc_tls client_ca + require_client_cert.
grpc_caller_auth:
  mode: "" # Set to "introspection" or "mtls" when backend OIDC is enabled.
  allow_unauthenticated: false # Migration only: true restores service-identity access with a warning.
  ca_file: "" # Empty uses system roots; otherwise a mounted PEM CA bundle.
  server_name: "" # Certificate DNS name for HTTPS over loopback.
  min_tls_version: "1.2"
  # introspection_endpoint: "https://login.example.net/oauth2/introspect"
  # issuer: "https://login.example.net"
  # audience: "proxy-api"
  # client_id: "proxy-introspection"
  # client_secret_env: "DOPPELGAENGER_INTROSPECTION_SECRET"
  required_scopes: []
  # method_scopes:
  #   - method: "/example.Identity/Lookup"
  #     scopes: ["identity:lookup"]
  timeout: "5s"

# grpc_backend_oidc_auth: optional client-credentials Bearer token source for
# primary gRPC upstream calls.
grpc_backend_oidc_auth:
  enabled: false
  # configuration_uri: "https://login.example.net/.well-known/openid-configuration"
  # token_endpoint: "https://login.example.net/oauth2/token"
  # client_id: "doppelgaenger-primary"
  # client_secret_env: "DOPPELGAENGER_GRPC_CLIENT_SECRET"
  auth_method: "auto"
  scopes: []
  timeout: "5s"
  refresh_skew: "30s"
  ca_file: ""
  server_name: ""
  min_tls_version: "1.2"
  insecure_tls: false # Legacy testing only; disables certificate and hostname verification.

shadow_grpc_targets: []
# Example:
# shadow_grpc_targets:
#   - name: shadow
#     address: "fakegrpcserver-shadow:9446"
#     tls:
#       enabled: false
#       # client_cert: "/certs/grpc-client.crt"
#       # client_key: "/certs/grpc-client.key"
shadow_grpc_selection_mode: "round_robin"

# HTTP Adapter Settings
# ------------------------------------------------------------------------------
# primary_base_urls: list of primary HTTP backends for load distribution.
primary_base_urls:
  - "http://fakehttpserver-primary:9001"

# primary_selection_mode: strategy for selecting one primary backend per request.
# Supported values: "round_robin", "source_ip_hash".
primary_selection_mode: "round_robin"

# shadow_base_urls: list of shadow HTTP backends for load distribution.
shadow_base_urls:
  - "http://fakehttpserver-shadow:9002"

# shadow_selection_mode: strategy for selecting one shadow backend per request.
# Supported values: "round_robin", "source_ip_hash".
shadow_selection_mode: "round_robin"

# Shadow & Rate Limiting Settings
# ------------------------------------------------------------------------------
# shadow_sample_percent: percentage of traffic mirrored to shadow (0-100).
shadow_sample_percent: 5

# shadow_force_header: header name whose non-empty value forces shadowing.
shadow_force_header: "X-Shadow"

# grpc_shadow_force_metadata: metadata key that forces gRPC shadowing when
# present and non-empty, unless a matched grpc_rules entry uses shadow: never.
grpc_shadow_force_metadata: "x-shadow"

# primary_request_headers: optional static headers added to requests sent to primary.
# path_rules[].primary_request_headers can override these values per matched path.
primary_request_headers: {}

# shadow_request_headers: optional static headers added to requests sent to shadow.
# path_rules[].shadow_request_headers can override these values per matched path.
shadow_request_headers: {}

# shadow_rps: process-local shadow decisions per second (0 disables).
shadow_rps: 200

# shadow_burst: maximum number of tokens in the token bucket (burst capacity).
shadow_burst: 400

# shadow_timeout: time limit for requests to the shadow backend.
shadow_timeout: "150ms"

# grpc_shadow_timeout and grpc_shadow_queue_size bound shadow gRPC work only.
grpc_shadow_timeout: "500ms"
grpc_shadow_queue_size: 128
grpc_max_receive_message_bytes: 4194304
grpc_max_send_message_bytes: 4194304

# max_backend_body_bytes: shared request/response body buffer limit. Oversized
# requests return 413; backend response bodies are truncated to this many bytes.
max_backend_body_bytes: 32768

# upstream_http_dial_timeout: timeout for establishing upstream TCP connections.
upstream_http_dial_timeout: "2s"

# upstream_http_tls_handshake_timeout: timeout for upstream TLS handshakes.
upstream_http_tls_handshake_timeout: "5s"

# upstream_http_response_header_timeout: timeout to receive upstream response headers.
upstream_http_response_header_timeout: "5s"

# upstream_http_max_idle_conns: max idle keep-alive connections across all hosts.
upstream_http_max_idle_conns: 1024

# upstream_http_max_idle_conns_per_host: max idle keep-alive connections per host.
upstream_http_max_idle_conns_per_host: 256

# upstream_http_max_conns_per_host: max total connections per host (0 = unlimited).
upstream_http_max_conns_per_host: 0

# upstream_http_protocol: upstream protocol mode (auto, http1, or http2).
# auto negotiates HTTP/2 when available, http1 disables it, and http2 rejects HTTP/1.1 fallback.
upstream_http_protocol: auto

# Header & Comparison Settings
# ------------------------------------------------------------------------------
# forward_response_headers: headers passed from the primary backend to the client.
forward_response_headers:
  - "Auth-Status"
  - "Auth-Server"
  - "Auth-Port"
  - "Auth-User"
  - "Auth-Pass"
  - "Auth-Error"
  - "Auth-Wait"
  - "Auth-Protocol"
  - "X-Session-ID"
  - "Location"
  - "Set-Cookie"
  - "Content-Type"
  - "Cache-Control"
  - "Pragma"
  - "Expires"
  - "WWW-Authenticate"
  - "Content-Encoding"
  - "Vary"

# compare_headers: list of HTTP response headers compared between primary and shadow.
compare_headers:
  - "Auth-Status"
  - "Auth-Server"
  - "Auth-Port"
  - "Auth-User"
  - "Auth-Error"
  - "X-Session-ID"

# compare_mode: selects the comparison mode (header, json, html).
compare_mode: "header"

# grpc_compare_mode: status, status_metadata, message_count, or message_hash.
grpc_compare_mode: "status"
grpc_compare_metadata:
  - "grpc-status"
  - "grpc-message"

# compare_json_strict: controls strict JSON comparison behavior.
compare_json_strict: false

# compare_html_threshold: required similarity for HTML comparison (0.0-1.0).
compare_html_threshold: 0.99

# Path Rule Settings
# ------------------------------------------------------------------------------
# path_rules: optional ordered HTTP path policy. Empty preserves global behavior.
# Rules match the inbound path before path_mapping rewrites it. If this list is
# non-empty and no rule matches, the request is primary-only.
path_rules: []

# Example: JSON API comparison, metrics/health deny, and catch-all primary-only.
# path_rules:
#   - name: json-api
#     methods: ["POST"]
#     match: "^/api/v1/json$"
#     shadow: auto
#     compare: on
#     compare_mode: json
#     compare_headers:
#       - "Content-Type"
#       - "X-Api-Status"
#     primary_request_headers:
#       X-Route-Backend: json-primary
#     shadow_request_headers:
#       X-Route-Backend: json-shadow
#
#   - name: metrics-health
#     match: "^/(metrics|healthz)$"
#     shadow: never
#     compare: off
#
#   - name: default-primary-only
#     match: "^/.*$"
#     shadow: never
#     compare: off

# grpc_rules: optional ordered gRPC service/method policy. Empty preserves
# global gRPC behavior. If non-empty and no rule matches, the RPC is primary-only.
grpc_rules: []
# Example:
# grpc_rules:
#   - name: auth-shadow
#     service: "example.auth.v1.AuthService"
#     methods: ["Authenticate", "LookupIdentity", "ListAccounts"]
#     shadow: auto
#     compare: on
#     compare_mode: status_metadata
#     compare_metadata: ["grpc-status", "grpc-message", "x-session-id"]
#     primary_metadata:
#       authorization: "Basic primary-token"
#     shadow_metadata:
#       authorization: "Basic shadow-token"
#   - name: default-primary-only
#     service: "*"
#     shadow: never
#     compare: off

# Logging Settings
# ------------------------------------------------------------------------------
# log_session_only_on_diff: log session headers only when differences exist.
log_session_only_on_diff: true

# log_only_on_diff: emit proxy result logs only for differences, shadow errors, or comparison errors.
log_only_on_diff: false

# log_json: whether the logger should output JSON.
log_json: false

# Observability Settings
# ------------------------------------------------------------------------------
# All observability features are opt-in. W3C trace context is propagated when
# a trace is active; trace_id_header adds the bare trace ID for downstream logs.
# For gRPC, this is emitted as lowercase metadata (for example x-trace-id).
observability:
  prometheus_enabled: false
  prometheus_address: "127.0.0.1"
  prometheus_port: 9464
  prometheus_path: "/metrics"
  prometheus_runtime_metrics: false
  # prometheus_http_auth_basic: "metrics:change-me"
  prometheus_tls:
    enabled: false
    # cert: "/etc/doppelgaenger/metrics.crt"
    # key: "/etc/doppelgaenger/metrics.key"
    min_tls_version: "1.2"
  otel_enabled: false
  otel_traces_enabled: false
  otel_metrics_enabled: false
  otel_service_name: "doppelgaenger"
  # otel_service_version defaults to the binary version.
  # otel_exporter_otlp_endpoint: "http://otel-collector:4318"
  # otel_exporter_otlp_headers:
  #   authorization: "Bearer token"
  otel_exporter_otlp_insecure: false
  otel_sample_ratio: 1.0
  trace_id_header: "X-Trace-ID"

# Path Mapping Settings
# ------------------------------------------------------------------------------
# path_mapping: controls how incoming request paths are mapped to backends.
path_mapping:
  # mode: "direct" (1:1 mapping) or "rewrite" (regex-based).
  mode: direct
  # rules: list of rewrite rules (only used if mode is "rewrite").
  rules: []
