name: Docker Build Push Reusable

"on":
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to check out before building.
        required: false
        default: ''
        type: string
      fetch_depth:
        description: Checkout fetch depth.
        required: false
        default: 1
        type: number
      checkout_path:
        description: Workspace path for the checked-out source.
        required: false
        default: source
        type: string
      dockerfile_path:
        description: Dockerfile path relative to the checkout.
        required: true
        type: string
      platforms:
        description: Target platforms.
        required: false
        default: linux/amd64,linux/arm64
        type: string
      push:
        description: Push the resulting image.
        required: false
        default: true
        type: boolean
      sbom:
        description: Generate an SBOM attestation.
        required: false
        default: false
        type: boolean
      provenance:
        description: Build provenance mode.
        required: false
        default: 'false'
        type: string
      tags:
        description: Image tags.
        required: true
        type: string
      annotations:
        description: OCI annotations.
        required: false
        default: ''
        type: string
      labels:
        description: OCI labels.
        required: false
        default: ''
        type: string
      build_args:
        description: Docker build arguments.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          path: ${{ inputs.checkout_path }}
          ref: ${{ inputs.source_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v3.11.1

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v6.18.0
        with:
          context: ./${{ inputs.checkout_path }}
          file: ./${{ inputs.checkout_path }}/${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          sbom: ${{ inputs.sbom }}
          provenance: ${{ inputs.provenance }}
          tags: ${{ inputs.tags }}
          annotations: ${{ inputs.annotations }}
          labels: ${{ inputs.labels }}
          build-args: ${{ inputs.build_args }}
