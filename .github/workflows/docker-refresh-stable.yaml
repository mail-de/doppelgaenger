name: Stable Docker Refresh

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  packages: write

jobs:
  detect-base-image-updates:
    runs-on: ubuntu-latest
    outputs:
      rebuild_suffix: ${{ steps.rebuild_suffix.outputs.rebuild_suffix }}
      release_tag: ${{ steps.latest_release.outputs.release_tag }}
      should_rebuild: ${{ steps.compare.outputs.should_rebuild || 'false' }}

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v3.11.1

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Determine latest stable release
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="$(gh release list \
            --repo "${{ github.repository }}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')"

          if [[ -z "${release_tag}" || "${release_tag}" == "null" ]]; then
            echo "No published stable release; skipping base-image refresh."
            echo "release_tag=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Create rebuild suffix
        id: rebuild_suffix
        if: steps.latest_release.outputs.release_tag != ''
        run: echo "rebuild_suffix=rebuild-$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

      - name: Resolve current base image digests
        id: base_digests
        if: steps.latest_release.outputs.release_tag != ''
        run: |
          while IFS= read -r line; do
            echo "${line}" >> "${GITHUB_OUTPUT}"
          done < <(./scripts/docker-base-digests.sh)

      - name: Compare against published stable image
        id: compare
        if: steps.latest_release.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ steps.latest_release.outputs.release_tag }}
          CERTS_DIGEST: ${{ steps.base_digests.outputs.certs_digest }}
          GOLANG_DIGEST: ${{ steps.base_digests.outputs.golang_digest }}
        run: |
          while IFS= read -r line; do
            echo "${line}" >> "${GITHUB_OUTPUT}"
          done < <(
            ./scripts/docker-stable-refresh-check.sh \
              --image "ghcr.io/${{ github.repository_owner }}/doppelgaenger:${RELEASE_TAG}" \
              --expected-certs-digest "${CERTS_DIGEST}" \
              --expected-golang-digest "${GOLANG_DIGEST}"
          )

  rebuild-stable-image:
    needs: detect-base-image-updates
    if: needs.detect-base-image-updates.outputs.should_rebuild == 'true'
    uses: ./.github/workflows/docker-stable-build.yaml
    with:
      rebuild_suffix: ${{ needs.detect-base-image-updates.outputs.rebuild_suffix }}
      release_tag: ${{ needs.detect-base-image-updates.outputs.release_tag }}
      build_reason: scheduled-base-refresh
