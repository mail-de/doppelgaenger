name: Release Build

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  APP_NAME: doppelgaenger
  DESC: Backend-neutral shadow proxy for HTTP, gRPC, and Milter traffic
  GOEXPERIMENT: runtimesecret
  GOVULNCHECK_VERSION: v1.7.0
  MAINTAINER: croessner
  SYFT_VERSION: v1.16.0

jobs:
  govulncheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version: 1.27.1

      - name: Install govulncheck
        run: |
          GOBIN="$(go env GOPATH)/bin" \
            go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Enable vendored dependencies
        run: go env -w GOFLAGS=-mod=vendor

      - name: Run govulncheck
        run: make govulncheck

  build-artifact:
    needs:
      - govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Validate release metadata
        run: ./scripts/release-semver-metadata.sh "${GITHUB_REF_NAME}" >/dev/null

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version: 1.27.1

      - name: Build release binary
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p build
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -mod=vendor -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X main.version=${version}" \
            -o build/doppelgaenger .

      - name: Create release archive
        run: |
          assets="${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "dist/${assets}/bin"
          cp build/doppelgaenger "dist/${assets}/bin/"
          cp LICENSE POLICY.md README.md config.yaml "dist/${assets}/"
          cp -R docs "dist/${assets}/docs"

          (
            cd dist
            tar czf "${assets}.tar.gz" "${assets}"
            sha256sum "${assets}.tar.gz" >"${assets}.tar.gz.sha256"
          )

      - name: Generate SBOM
        run: |
          assets="${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          ./scripts/sbom.sh \
            --source-dir "dist/${assets}" \
            --output-dir "dist/${assets}" \
            --output-prefix "${assets}" \
            --skip-docker \
            --syft-version "${{ env.SYFT_VERSION }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: artifact-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*/*.spdx.json

      - name: Attest release artifact
        if: vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          create-storage-record: false
          subject-path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*/*.spdx.json

  build-linux-packages:
    needs:
      - govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            rpm_arch: x86_64
            build_rpm: true
          - goos: linux
            goarch: arm64
            build_rpm: false

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version: 1.27.1

      - name: Build release binary
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p build
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -mod=vendor -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X main.version=${version}" \
            -o build/doppelgaenger .

      - name: Resolve release metadata
        id: release_metadata
        run: ./scripts/release-semver-metadata.sh "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Populate package roots
        run: |
          for package_root in .debpkg .rpmpkg; do
            mkdir -p \
              "${package_root}/usr/local/bin" \
              "${package_root}/usr/lib/systemd/system" \
              "${package_root}/usr/share/doc/doppelgaenger"
            cp build/doppelgaenger "${package_root}/usr/local/bin/"
            cp doppelgaenger.service doppelgaenger.socket \
              "${package_root}/usr/lib/systemd/system/"
            cp LICENSE POLICY.md README.md config.yaml \
              "${package_root}/usr/share/doc/doppelgaenger/"
          done

      - name: Build DEB
        uses: jiro4989/build-deb-action@a883c65147d80579cb359548b9a902ff0a35ae5b  # v4.3.0
        with:
          package: ${{ env.APP_NAME }}
          package_root: .debpkg
          maintainer: ${{ env.MAINTAINER }}
          version: ${{ steps.release_metadata.outputs.package_version }}
          arch: ${{ matrix.goarch }}
          desc: ${{ env.DESC }}

      - name: Build RPM
        if: ${{ matrix.build_rpm }}
        uses: jiro4989/build-rpm-action@f11474937f502aaa8bb36d8c1a8ec6f8de536a0c  # v2.5.0
        with:
          package: ${{ env.APP_NAME }}
          package_root: .rpmpkg
          maintainer: ${{ env.MAINTAINER }}
          version: ${{ steps.release_metadata.outputs.package_version }}
          arch: ${{ matrix.rpm_arch }}
          desc: ${{ env.DESC }}
          summary: ${{ env.DESC }}

      - name: Generate package checksums and SBOMs
        run: |
          mkdir -p dist/sbom
          for pkg in ./*.deb ./*.rpm; do
            if [[ -f "$pkg" ]]; then
              safe_pkg="${pkg//\~/.}"
              if [[ "$safe_pkg" != "$pkg" ]]; then
                mv "$pkg" "$safe_pkg"
                pkg="$safe_pkg"
              fi
              sha256sum "$pkg" >"${pkg}.sha256"
              ./scripts/sbom.sh \
                --file "$pkg" \
                --output-dir dist/sbom \
                --skip-source \
                --skip-docker \
                --syft-version "${{ env.SYFT_VERSION }}"
            fi
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: artifact-${{ matrix.goos }}-${{ matrix.goarch }}-pkgs
          path: |
            ./*.deb
            ./*.deb.sha256
            ./*.rpm
            ./*.rpm.sha256
            dist/sbom/*.spdx.json

      - name: Attest DEB artifacts
        if: vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          create-storage-record: false
          subject-path: |
            ./*.deb
            ./*.deb.sha256
            dist/sbom/*.deb.spdx.json

      - name: Attest RPM artifacts
        if: vars.ENABLE_GITHUB_ATTESTATIONS == 'true' && matrix.build_rpm
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          create-storage-record: false
          subject-path: |
            ./*.rpm
            ./*.rpm.sha256
            dist/sbom/*.rpm.spdx.json

  create-release:
    needs:
      - govulncheck
      - build-artifact
      - build-linux-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release_metadata
        run: ./scripts/release-semver-metadata.sh "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release_metadata.outputs.prerelease }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi

          last_release_tag="$(gh release view --repo "${{ github.repository }}" --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ -n "${last_release_tag}" ]]; then
            ahead_by="$(gh api "repos/${{ github.repository }}/compare/${last_release_tag}...${GITHUB_REF_NAME}" --jq '.ahead_by')"
            if [[ "${ahead_by}" -eq 0 ]]; then
              echo "No new commits since ${last_release_tag}; aborting release creation."
              exit 1
            fi
          fi

          notes_file="$(mktemp)"
          trap 'rm -f "${notes_file}"' EXIT
          printf '## Commit Summary\n\n' >"${notes_file}"

          append_section() {
            local title="$1"
            local pattern="$2"
            local entries

            if [[ -n "${last_release_tag}" ]]; then
              entries="$(git log "${last_release_tag}..${GITHUB_REF_NAME}" --pretty=format:'- %s (%h)' --no-merges --regexp-ignore-case --grep="^${pattern}" || true)"
            else
              entries="$(git log "${GITHUB_REF_NAME}" --pretty=format:'- %s (%h)' --no-merges --regexp-ignore-case --grep="^${pattern}" || true)"
            fi

            if [[ -n "${entries}" ]]; then
              printf '### %s\n%s\n\n' "${title}" "${entries}" >>"${notes_file}"
            fi
          }

          append_section Added 'Add:'
          append_section Changed 'Change:'
          append_section Fixed 'Fix:'
          append_section Removed 'Remove:'
          append_section Refactored 'Refactor:'
          append_section Tests 'Test:'
          append_section Documentation 'Docs:'
          append_section 'Build And CI' '(Build|Ci):'
          append_section Security 'Security:'
          append_section Dependencies 'Vendor:'
          append_section Chores 'Chore:'

          release_args=(
            "${GITHUB_REF_NAME}"
            --repo "${{ github.repository }}"
            --verify-tag
            --notes-file "${notes_file}"
            --generate-notes
          )

          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi

          gh release create "${release_args[@]}"

  upload-release:
    needs:
      - build-artifact
      - create-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: artifact-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --clobber \
            "dist/${assets}.tar.gz" \
            "dist/${assets}.tar.gz.sha256" \
            "dist/${assets}/${assets}-source.spdx.json"

  upload-linux-packages:
    needs:
      - create-release
      - build-linux-packages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            pkg: deb
          - goos: linux
            goarch: amd64
            pkg: rpm
          - goos: linux
            goarch: arm64
            pkg: deb

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: artifact-${{ matrix.goos }}-${{ matrix.goarch }}-pkgs

      - name: Select package asset
        run: |
          asset_name="$(find . -maxdepth 1 -type f -name '*.${{ matrix.pkg }}' -print -quit)"
          asset_name="${asset_name#./}"
          [[ -n "$asset_name" ]] || {
            echo "No .${{ matrix.pkg }} package found" >&2
            exit 1
          }
          echo "ASSET_NAME=${asset_name}" >> "$GITHUB_ENV"

      - name: Upload package asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --clobber \
            "$ASSET_NAME" \
            "${ASSET_NAME}.sha256" \
            "dist/sbom/${ASSET_NAME}.spdx.json"
