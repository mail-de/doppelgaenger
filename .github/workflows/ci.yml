name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.12.2
          install-mode: binary
          args: --version

      - name: Run guardrails
        run: make guardrails

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
          cache: true

      - name: Run E2E checks
        run: make e2e
