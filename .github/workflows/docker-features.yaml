name: Development Docker Build

"on":
  push:
    branches:
      - features

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/docker-build-push.yaml
    with:
      source_ref: ${{ github.sha }}
      fetch_depth: 0
      dockerfile_path: Dockerfile
      tags: |
        ghcr.io/${{ github.repository_owner }}/doppelgaenger:dev
        ghcr.io/${{ github.repository_owner }}/doppelgaenger:features
      annotations: >-
        index,manifest:org.opencontainers.image.description=Backend-neutral
        shadow proxy for HTTP, gRPC, and Milter traffic
      labels: |
        org.opencontainers.image.description=Backend-neutral shadow proxy for HTTP, gRPC, and Milter traffic
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.version=dev
        de.mail.doppelgaenger.build.reason=features-push
      build_args: |
        VERSION=dev
        REVISION=${{ github.sha }}
        SOURCE=https://github.com/${{ github.repository }}
